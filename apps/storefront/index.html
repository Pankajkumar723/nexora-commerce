<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Nexora Commerce | Premium AI-Powered E-Commerce Store</title>
    <meta name="title" content="Nexora Commerce | Premium AI-Powered E-Commerce Store" />
    <meta
      name="description"
      content="Nexora Commerce is an AI-powered enterprise e-commerce platform offering studio ANC acoustics, smart wearables, minimalist desk gear, and curated electronics with fast pan-India delivery."
    />
    <meta name="keywords" content="ecommerce, electronics, smart wearables, ANC headphones, ergonomic desk, fast delivery, razorpay, AI shopping" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#173D72" />
    <link rel="canonical" href="http://localhost:3000/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://localhost:3000/" />
    <meta property="og:title" content="Nexora Commerce | Premium AI-Powered E-Commerce Store" />
    <meta
      property="og:description"
      content="Next-generation multi-vendor shopping experience with intelligent catalog assistance, curated hardware, and instant checkout."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:site_name" content="Nexora Commerce" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexora Commerce | Premium AI-Powered E-Commerce Store" />
    <meta
      name="twitter:description"
      content="Next-generation multi-vendor shopping experience with intelligent catalog assistance, curated hardware, and instant checkout."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-80x80.png" />

    <!-- Performance: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- LCP Hero Image Preload (Instant download before JS parses) -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=900&q=75"
      fetchpriority="high"
    />

    <!-- Non-render blocking Web Fonts -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

  </head>
  <body class="bg-canvas text-gray-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
