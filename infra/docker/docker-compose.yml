version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora_user} -d ${POSTGRES_DB:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexora_pgdata:
    driver: local
