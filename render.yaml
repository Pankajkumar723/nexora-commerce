databases:
  - name: nexora-postgres
    databaseName: nexora_commerce
    user: nexora_user
    plan: free
    region: oregon

services:
  # -------------------------------------------------------------
  # 1. NestJS Backend API Web Service
  # -------------------------------------------------------------
  - type: web
    name: nexora-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm run build:api
    startCommand: pnpm run db:setup && pnpm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://nexora-api-hizw.onrender.com
      - key: STORE_URL
        value: https://nexora-storefront-wn8v.onrender.com
      - key: ADMIN_URL
        value: https://nexora-admin.onrender.com
      - key: SELLER_URL
        value: https://nexora-seller.onrender.com
      - key: RAZORPAY_KEY_ID
        value: rzp_test_sample
      - key: RAZORPAY_KEY_SECRET
        value: secret_mock
      - key: RAZORPAY_WEBHOOK_SECRET
        value: webhook_secret_mock
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: AI_PROVIDER_API_KEY
        value: ""

  # -------------------------------------------------------------
  # 2. Storefront (Customer Web App) - Static Site
  # -------------------------------------------------------------
  - type: web
    name: nexora-storefront
    runtime: static
    buildCommand: pnpm install && pnpm run build:storefront
    staticPublishPath: ./apps/storefront/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://nexora-api-hizw.onrender.com

  # -------------------------------------------------------------
  # 3. Admin Console (Merchant / Admin Portal) - Static Site
  # -------------------------------------------------------------
  - type: web
    name: nexora-admin
    runtime: static
    buildCommand: pnpm install && pnpm run build:admin
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://nexora-api-hizw.onrender.com

  # -------------------------------------------------------------
  # 4. Seller Portal (Vendor Dashboard) - Static Site
  # -------------------------------------------------------------
  - type: web
    name: nexora-seller
    runtime: static
    buildCommand: pnpm install && pnpm run build:seller
    staticPublishPath: ./apps/seller/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://nexora-api-hizw.onrender.com